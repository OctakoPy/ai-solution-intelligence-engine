site_name: Solution Intelligence Engine
site_url: https://OctakoPy.github.io/ai-solution-intelligence-engine/
repo_url: https://github.com/OctakoPy/ai-solution-intelligence-engine
repo_name: ai-solution-intelligence-engine

theme:
  name: "material"
  palette:
  # Palette toggle for light mode
    - scheme: default
      primary: black
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: simple/rocket

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer

plugins:
  - mkdocstrings:
      default_handler: python
      locale: en
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true      # shows module name as heading
            show_root_full_path: true    # gives full module path
  - search
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OctakoPy

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Demo Script: tutorials/demo-script.md
  - How-To:
      - Overview: how-to/index.md
  - Reference: reference/index.md
  - Explanation:
      - Overview: explanation/index.md
  - Architecture:
      - Overview: architecture/index.md
      - ADRs: architecture/adr/index.md
      - ADR-001 (ADRs): architecture/adr/001-use-architectural-decision-records.md
      - ADR-002 (uv): architecture/adr/002-manage-dependencies-with-uv.md
  - Tags: tags.md

extra_javascript:
    - javascript/readthedocs.js
