version: 2
updates:
  # Keep uv dependencies up to date
  - package-ecosystem: "uv"
    directory: "/"                    # where pyproject.toml lives
    schedule:
      interval: "daily"
    versioning-strategy: "increase"   # allow minor/patch bumps
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
    ignore:
      # Deliberate caps: ruff 0.16 changes formatting/lint behavior and
      # plotly 7 is a major that the demo notebook has not been validated on.
      - dependency-name: "ruff"
        versions: [">=0.16.0"]
      - dependency-name: "plotly"
        versions: [">=7.0.0"]

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"