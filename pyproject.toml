[project]
name = "solution-intelligence"
version = "0.10.0"
description = "AI-powered enterprise knowledge intelligence system that unifies ticketing, SAP, SharePoint, and knowledge base systems to resolve support issues instantly."
authors = [
    {name = "Octako",email = "octakopy@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=6.0.1",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0,<3.0.0",
]

[dependency-groups]
dev = [
    "ipywidgets (>=8.1.7,<9.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "nbmake>=1.5.5",
    "numpy>=2.4.6,<3.0.0",
    "plotly>=6.8.0,<7.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.15.17,<0.16.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pyright>=1.1.410,<2.0.0",
    "httpx>=0.27.0",
]

docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material"
]


[tool.coverage.run]
source = ["src/solution_intelligence"]
omit = [
    "tests/*",
    "conftest.py"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv-build>=0.11.29,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "solution_intelligence"
module-root = "src"
